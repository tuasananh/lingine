name: Release CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            extension: '.exe'
          - os: macos-latest
            target: universal2-apple-darwin
            suffix: macos-universal
            extension: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set artifact name
        id: artifact
        shell: bash
        run: echo "NAME=lingine-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}${{ matrix.extension }}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal2-apple-darwin' && 'x86_64-apple-darwin aarch64-apple-darwin' || matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary (Standard targets)
        if: matrix.target != 'universal2-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (macOS Universal)
        if: matrix.target == 'universal2-apple-darwin'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create \
            target/x86_64-apple-darwin/release/lingine \
            target/aarch64-apple-darwin/release/lingine \
            -output target/release/lingine-universal

      - name: Prepare Assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "universal2-apple-darwin" ]; then
            cp target/release/lingine-universal dist/${{ steps.artifact.outputs.NAME }}
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/lingine.exe dist/${{ steps.artifact.outputs.NAME }}
          else
            cp target/${{ matrix.target }}/release/lingine dist/${{ steps.artifact.outputs.NAME }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.NAME }}
          path: dist/${{ steps.artifact.outputs.NAME }}

  create-draft-release:
    name: Create Draft GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*/*
          draft: true
          prerelease: false
          generate_release_notes: true
