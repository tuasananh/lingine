name: Eval Gauntlet (Commit vs Historical)

on:
  push:
    tags: ["v*"] # also runs when a release tag is pushed
  workflow_dispatch:
    inputs:
      gauntlet_games:
        description: "Number of gauntlet games per opponent ELO tier"
        required: false
        default: "500"
        type: string
      match_games:
        description: "Number of games for each 1v1 match"
        required: false
        default: "1000"
        type: string
      concurrency:
        description: "Number of parallel games (0 = auto)"
        required: false
        default: "8"
        type: string

jobs:
  gauntlet:
    name: Run Historical Eval Gauntlet
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    outputs:
      report_path: ${{ steps.summary.outputs.report_path }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 2. Rust toolchain + cache ─────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artefacts
        uses: Swatinem/rust-cache@v2

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # ── 3.5. System Dependencies ──────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqt5core5a

      # ── 4. Tournament tools ───────────────────────────────────────────────
      - name: Download tournament tools
        run: python ./scripts/setup_tools.py

      # ── 5. Build current commit ───────────────────────────────────────────
      - name: Build commit binary (release)
        run: cargo build --release

      - name: Capture commit label
        id: commit
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          REF="${GITHUB_REF_NAME:-$SHA}"
          SAFE_REF="${REF//\//-}"
          echo "label=commit-${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Register commit binary in historical/
        run: |
          mkdir -p historical
          LABEL="${{ steps.commit.outputs.label }}"
          cp ./target/release/lingine "historical/lingine-${LABEL}"
          chmod +x "historical/lingine-${LABEL}"
          echo "Registered: historical/lingine-${LABEL}"

      # ── 6. Build v1.0.0-base in an isolated worktree ─────────────────────
      - name: Build v1.0.0-base binary
        run: |
          BASELINE_TAG="v1.0.0"
          BIN_DEST="historical/lingine-1.0.0-base"

          # First try a pre-built release asset
          URL="https://github.com/${{ github.repository }}/releases/download/${BASELINE_TAG}/lingine-linux-x86_64"
          HTTP=$(curl -sLo "$BIN_DEST" -w "%{http_code}" \
                    -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL")

          if [ "$HTTP" = "200" ]; then
            chmod +x "$BIN_DEST"
            echo "Downloaded pre-built ${BASELINE_TAG} binary."
          else
            echo "No pre-built binary (HTTP ${HTTP}). Compiling ${BASELINE_TAG} in isolated worktree…"
            git worktree add /tmp/baseline-build "tags/${BASELINE_TAG}"
            cd /tmp/baseline-build
            cargo build --release
            cd -
            cp /tmp/baseline-build/target/release/lingine "$BIN_DEST"
            chmod +x "$BIN_DEST"
            git worktree remove --force /tmp/baseline-build
            echo "Built ${BASELINE_TAG} binary."
          fi

      # ── 7. Fetch latest published release binary ──────────────────────────
      - name: Fetch latest release binary
        id: latest_release
        run: |
          LATEST_TAG=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name',''))")

          if [ -z "$LATEST_TAG" ]; then
            echo "No published release found; skipping latest-release baseline."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Latest published release: ${LATEST_TAG}"
            echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

            SAFE_TAG="${LATEST_TAG//\//-}"
            BIN_NAME="lingine-${SAFE_TAG}-latest"

            URL="https://github.com/${{ github.repository }}/releases/download/${LATEST_TAG}/lingine-linux-x86_64"
            HTTP=$(curl -sLo "historical/${BIN_NAME}" -w "%{http_code}" \
                      -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL")

            if [ "$HTTP" = "200" ]; then
              chmod +x "historical/${BIN_NAME}"
              echo "Downloaded pre-built ${LATEST_TAG} binary."
            else
              echo "No pre-built binary (HTTP ${HTTP}). Compiling ${LATEST_TAG} in isolated worktree…"
              git worktree add /tmp/latest-build "tags/${LATEST_TAG}"
              cd /tmp/latest-build
              cargo build --release
              cd -
              cp /tmp/latest-build/target/release/lingine "historical/${BIN_NAME}"
              chmod +x "historical/${BIN_NAME}"
              git worktree remove --force /tmp/latest-build
              echo "Built ${LATEST_TAG} binary."
            fi
          fi

      # ── 8. Run unified historical evaluation ──────────────────────────────
      # Calling the unified script will natively loop through gauntlet + both neighbor and base matches
      # as well as compile the final report.
      - name: Run historical evaluation (gauntlet + matches)
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          G_GAMES="${{ inputs.gauntlet_games || '500' }}"
          M_GAMES="${{ inputs.match_games || '1000' }}"
          CONC="${{ inputs.concurrency || '8' }}"

          python ./scripts/run_historical_evals.py \
            --version "$LABEL" \
            --gauntlet-games "$G_GAMES" \
            --match-games "$M_GAMES" \
            --concurrency "$CONC"

      # ── 9. Assemble CI summary markdown ──────────────────────────────────
      - name: Assemble CI summary markdown
        id: summary
        if: always()
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          REPORT="matches/historical/reports/${LABEL}_comprehensive_report.md"
          OUT="ci_eval_report.md"
          LATEST="${{ steps.latest_release.outputs.tag }}"

          {
            echo "## 🎯 Lingine Eval Gauntlet — \`${{ steps.commit.outputs.sha }}\`"
            echo ""

            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "_Comprehensive report not generated (job may have failed earlier)._"
            fi

            echo ""
            echo "### ⚔️ vs v1.0.0-base"
            BASE_SUM="matches/historical/base_matches/${LABEL}-vs-1.0.0-base/summary.md"
            if [ -f "$BASE_SUM" ]; then
              cat "$BASE_SUM"
            else
              echo "_Match not run or failed._"
            fi

            if [ -n "$LATEST" ]; then
              SAFE_TAG="${LATEST//\//-}"
              echo ""
              echo "### ⚔️ vs ${LATEST} (latest release)"
              LATEST_SUM="matches/historical/neighbor_matches/${LABEL}-vs-${SAFE_TAG}-latest/summary.md"
              if [ -f "$LATEST_SUM" ]; then
                cat "$LATEST_SUM"
              else
                echo "_Match not run or failed._"
              fi
            fi
          } > "$OUT"

          echo "report_path=$OUT" >> "$GITHUB_OUTPUT"

      # ── 10. GitHub Job Summary ────────────────────────────────────────────
      - name: Write to GitHub Job Summary
        if: always() && steps.summary.outputs.report_path != ''
        run: cat "${{ steps.summary.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"

      # ── 11. PR comment ────────────────────────────────────────────────────
      - name: Post report as PR comment
        if: github.event_name == 'pull_request' && steps.summary.outputs.report_path != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gauntlet-eval
          path: ${{ steps.summary.outputs.report_path }}

      # ── 12. Upload artefacts ──────────────────────────────────────────────
      - name: Upload eval artefacts
        if: always() && steps.summary.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-eval-${{ steps.commit.outputs.sha }}
          path: |
            ci_eval_report.md
            matches/historical/

  # ── Post eval report into the draft release ────────────────────────────────
  post-to-release:
    name: Append Eval Report to Draft Release
    needs: gauntlet
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download eval report artefact
        uses: actions/download-artifact@v5
        with:
          name: gauntlet-eval-${{ needs.gauntlet.outputs.sha }}
          path: eval-results

      - name: Wait for draft release to be created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Waiting for draft release for tag: ${TAG}"
          for i in $(seq 1 20); do
            RELEASE_ID=$(gh api \
              "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id" \
              2>/dev/null || true)
            if [ -n "$RELEASE_ID" ]; then
              echo "Draft release found (id: ${RELEASE_ID})."
              echo "release_id=${RELEASE_ID}" >> "$GITHUB_ENV"
              break
            fi
            echo "  attempt ${i}/20 — not yet available, retrying in 30s…"
            sleep 30
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Draft release not found after 10 minutes. Skipping body update."
          fi

      - name: Append eval report to draft release body
        if: env.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE="eval-results/ci_eval_report.md"

          CURRENT_BODY=$(gh api \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --jq '.body // ""')

          SEPARATOR="$(printf '\n\n%s\n\n' '---')"
          printf '%s%s%s' "$CURRENT_BODY" "$SEPARATOR" "$(cat "$REPORT_FILE")" \
            > /tmp/new_body.md

          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --field body=@/tmp/new_body.md

          echo "Eval report appended to draft release ${GITHUB_REF_NAME}."
