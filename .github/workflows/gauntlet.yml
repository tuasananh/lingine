name: Eval Gauntlet (Commit vs Historical)

on:
  push:
    branches: ["**"]
    tags: ["v*"] # also runs when a release tag is pushed
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      games:
        description: "Number of gauntlet games per version"
        required: false
        default: "10"
        type: string
      concurrency:
        description: "Number of parallel games (0 = auto)"
        required: false
        default: "2"
        type: string

jobs:
  gauntlet:
    name: Run Historical Eval Gauntlet
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # needed to post PR comments

    outputs:
      report_path: ${{ steps.summary.outputs.report_path }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      # ── 1. Checkout current commit ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can check out arbitrary tags

      # ── 2. Rust toolchain + cache ─────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artefacts
        uses: Swatinem/rust-cache@v2

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # ── 4. Tournament tools ───────────────────────────────────────────────
      - name: Download tournament tools
        run: python ./scripts/setup_tools.py

      # ── 5. Build current commit ───────────────────────────────────────────
      - name: Build commit binary (release)
        run: cargo build --release

      - name: Capture commit label
        id: commit
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # On a tag push GITHUB_REF_NAME is the tag (e.g. v1.6.5); on a
          # branch push it is the branch name.
          REF="${GITHUB_REF_NAME:-$SHA}"
          SAFE_REF="${REF//\//-}"
          echo "label=commit-${SAFE_REF}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Copy commit binary to historical/
        run: |
          mkdir -p historical
          LABEL="${{ steps.commit.outputs.label }}"
          cp ./target/release/lingine "historical/lingine-${LABEL}"
          chmod +x "historical/lingine-${LABEL}"
          echo "Commit binary registered as: historical/lingine-${LABEL}"

      # ── 6. Fetch v1.0.0-base binary ───────────────────────────────────────
      # Tries the release asset first; falls back to compiling from the tag.
      # Change BASELINE_TAG to "v1.0.0" once that tag ships a binary.
      - name: Fetch v1.0.0-base binary
        id: baseline
        run: |
          BASELINE_TAG="v1.0.0"
          mkdir -p historical

          echo "Fetching pre-built binary for ${BASELINE_TAG} …"
          URL="https://github.com/${{ github.repository }}/releases/download/${BASELINE_TAG}/lingine-linux-x86_64"
          HTTP=$(curl -sLo historical/lingine-1.0.0-base -w "%{http_code}" \
                   -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL")
          if [ "$HTTP" = "200" ]; then
            chmod +x historical/lingine-1.0.0-base
            echo "Downloaded pre-built ${BASELINE_TAG} binary."
          else
            echo "Pre-built binary not found (HTTP ${HTTP}). Compiling from tag ${BASELINE_TAG} …"
            git checkout "tags/${BASELINE_TAG}" -- .
            cargo build --release
            cp ./target/release/lingine historical/lingine-1.0.0-base
            chmod +x historical/lingine-1.0.0-base
            git checkout HEAD -- .
          fi

      # ── 7. Fetch latest published release binary ──────────────────────────
      # On a tag push the "latest" release is the one being created (still a
      # draft), so we resolve the latest *published* release via the API and
      # skip if none exists yet.
      - name: Fetch latest release binary
        id: latest_release
        run: |
          LATEST_TAG=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name',''))")

          if [ -z "$LATEST_TAG" ]; then
            echo "No published release found; skipping latest-release baseline."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Latest published release: ${LATEST_TAG}"
            echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

            SAFE_TAG="${LATEST_TAG//\//-}"
            BIN_NAME="lingine-${SAFE_TAG}-latest"
            URL="https://github.com/${{ github.repository }}/releases/download/${LATEST_TAG}/lingine-linux-x86_64"
            HTTP=$(curl -sLo "historical/${BIN_NAME}" -w "%{http_code}" \
                     -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL")
            if [ "$HTTP" = "200" ]; then
              chmod +x "historical/${BIN_NAME}"
              echo "Downloaded pre-built ${LATEST_TAG} binary."
            else
              echo "Pre-built binary not found (HTTP ${HTTP}). Compiling from tag ${LATEST_TAG} …"
              git checkout "tags/${LATEST_TAG}" -- .
              cargo build --release
              cp ./target/release/lingine "historical/${BIN_NAME}"
              chmod +x "historical/${BIN_NAME}"
              git checkout HEAD -- .
            fi
          fi

      # ── 8. Run gauntlet for commit version only ───────────────────────────
      - name: Run gauntlet evaluation
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          GAMES="${{ inputs.games || '10' }}"
          CONC="${{ inputs.concurrency || '2' }}"

          python ./scripts/run_historical_evals.py \
            --gauntlets-only \
            --version "$LABEL" \
            --gauntlet-games "$GAMES" \
            --concurrency "$CONC"

      # ── 9. 1v1 matches ────────────────────────────────────────────────────
      - name: Match — commit vs v1.0.0-base
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          GAMES="${{ inputs.games || '10' }}"
          CONC="${{ inputs.concurrency || '2' }}"

          python ./scripts/run_match.py \
            -a "historical/lingine-${LABEL}" --name-a "commit-${LABEL}" \
            -b historical/lingine-1.0.0-base  --name-b "v1.0.0-base" \
            -g "$GAMES" -c "$CONC" -s \
            -o "matches/ci/commit-vs-base"

      - name: Match — commit vs latest release
        if: steps.latest_release.outputs.tag != ''
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          LATEST_TAG="${{ steps.latest_release.outputs.tag }}"
          SAFE_TAG="${LATEST_TAG//\//-}"
          GAMES="${{ inputs.games || '10' }}"
          CONC="${{ inputs.concurrency || '2' }}"

          python ./scripts/run_match.py \
            -a "historical/lingine-${LABEL}" --name-a "commit-${LABEL}" \
            -b "historical/lingine-${SAFE_TAG}-latest" --name-b "$LATEST_TAG" \
            -g "$GAMES" -c "$CONC" -s \
            -o "matches/ci/commit-vs-latest"

      # ── 10. Compile full report ───────────────────────────────────────────
      - name: Compile version report
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          python ./scripts/compile_version_report.py --version "$LABEL"

      # ── 11. Assemble CI summary markdown ──────────────────────────────────
      - name: Assemble CI summary markdown
        id: summary
        run: |
          LABEL="${{ steps.commit.outputs.label }}"
          REPORT="matches/historical/reports/${LABEL}_comprehensive_report.md"
          OUT="ci_eval_report.md"
          LATEST="${{ steps.latest_release.outputs.tag }}"

          {
            echo "## 🎯 Lingine Eval Gauntlet — \`${{ steps.commit.outputs.sha }}\`"
            echo ""

            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            else
              echo "_Comprehensive report not generated._"
            fi

            echo ""
            echo "---"
            echo "### ⚔️ vs v1.0.0-base"
            if [ -f matches/ci/commit-vs-base/summary.md ]; then
              cat matches/ci/commit-vs-base/summary.md
            else
              echo "_Match not run or failed._"
            fi

            if [ -n "$LATEST" ]; then
              echo ""
              echo "---"
              echo "### ⚔️ vs ${LATEST} (latest release)"
              if [ -f "matches/ci/commit-vs-latest/summary.md" ]; then
                cat matches/ci/commit-vs-latest/summary.md
              else
                echo "_Match not run or failed._"
              fi
            fi
          } > "$OUT"

          echo "report_path=$OUT" >> "$GITHUB_OUTPUT"

      # ── 12. GitHub Job Summary (always visible in Actions tab) ────────────
      - name: Write to GitHub Job Summary
        if: always()
        run: cat "${{ steps.summary.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"

      # ── 13. PR comment ────────────────────────────────────────────────────
      - name: Post report as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gauntlet-eval
          path: ${{ steps.summary.outputs.report_path }}

      # ── 14. Upload artefacts ──────────────────────────────────────────────
      - name: Upload eval artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-eval-${{ steps.commit.outputs.sha }}
          path: |
            ci_eval_report.md
            matches/ci/
            matches/historical/reports/
            matches/historical/gauntlets/

  # ── Post eval report into the draft release ────────────────────────────────
  # Only runs when the trigger is a tag push (i.e. a release is being cut).
  # It waits for the gauntlet job, then appends the report to the draft release
  # body that release.yml already created with softprops/action-gh-release.
  post-to-release:
    name: Append Eval Report to Draft Release
    needs: gauntlet
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write # required to edit the draft release body

    steps:
      - name: Download eval report artefact
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-eval-${{ needs.gauntlet.outputs.sha }}
          path: eval-results

      # release.yml's create-draft-release job may still be running in
      # parallel (it builds 3 platform binaries first). Poll until the draft
      # release for this tag exists before we try to edit it.
      - name: Wait for draft release to be created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Waiting for draft release for tag: ${TAG}"
          for i in $(seq 1 20); do
            RELEASE_ID=$(gh api \
              "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id" \
              2>/dev/null || true)
            if [ -n "$RELEASE_ID" ]; then
              echo "Draft release found (id: ${RELEASE_ID})."
              echo "release_id=${RELEASE_ID}" >> "$GITHUB_ENV"
              break
            fi
            echo "  attempt ${i}/20 — not yet available, retrying in 30 s …"
            sleep 30
          done
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Draft release not found after 10 minutes. Skipping body update."
            exit 0
          fi

      - name: Append eval report to draft release body
        if: env.release_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPORT_FILE="eval-results/ci_eval_report.md"

          # Fetch the current draft body (may already contain auto-generated notes)
          CURRENT_BODY=$(gh api \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --jq '.body // ""')

          # Build the new body: existing notes + separator + eval report
          # (Use printf so the literal --- doesn't trip the YAML parser)
          SEPARATOR="$(printf '\n\n%s\n\n' '---')"
          printf '%s%s%s' "$CURRENT_BODY" "$SEPARATOR" "$(cat "$REPORT_FILE")" \
            > /tmp/new_body.md

          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --field body=@/tmp/new_body.md

          echo "✅ Eval report appended to draft release ${TAG}."
